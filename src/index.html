<!-- src/index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>🦈 鲨鲨工具</title>
  <style>
    /* ===== 全局 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: rgba(26, 27, 38, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #cdd6f4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      overflow: hidden;
      user-select: none;
    }

    /* 可拖拽区域 */
    .drag-area {
      -webkit-app-region: drag;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      z-index: 10;
    }

    /* ===== 容器 ===== */
    .container {
      width: 100%;
      height: 100%;
      padding: 20px 24px 24px;
      display: flex;
      flex-direction: column;
    }

    /* ===== 搜索框 ===== */
    .search-box {
      position: relative;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .search-box .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      opacity: 0.5;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      color: #cdd6f4;
      font-size: 15px;
      outline: none;
      transition: all 0.25s;
      font-weight: 400;
    }

    .search-box input:focus {
      border-color: rgba(137, 180, 250, 0.4);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(137, 180, 250, 0.08);
    }

    .search-box input::placeholder {
      color: #6c7086;
      font-weight: 300;
    }

    .search-box .shortcut-hint {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: #45475a;
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 10px;
      border-radius: 4px;
      letter-spacing: 0.3px;
      font-weight: 500;
    }

    /* ===== 标签栏 ===== */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .tabs button {
      padding: 4px 14px;
      background: none;
      border: none;
      color: #6c7086;
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      font-weight: 500;
    }

    .tabs button:hover {
      color: #a6adc8;
      background: rgba(255, 255, 255, 0.04);
    }

    .tabs button.active {
      color: #89b4fa;
      background: rgba(137, 180, 250, 0.12);
    }

    /* ===== 插件/命令列表 ===== */
    .content-area {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .content-area::-webkit-scrollbar {
      width: 3px;
    }

    .content-area::-webkit-scrollbar-thumb {
      background: #45475a;
      border-radius: 4px;
    }

    .content-area::-webkit-scrollbar-track {
      background: transparent;
    }

    /* 网格视图 */
    .grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
    }

    /* 列表视图 */
    .list-view {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .list-view .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .list-view .item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .list-view .item .item-icon {
      font-size: 22px;
      width: 36px;
      text-align: center;
    }

    .list-view .item .item-name {
      font-size: 14px;
      color: #cdd6f4;
    }

    .list-view .item .item-desc {
      font-size: 12px;
      color: #6c7086;
      margin-left: 8px;
    }

    .list-view .item .item-shortcut {
      margin-left: auto;
      font-size: 12px;
      color: #45475a;
      font-weight: 500;
    }

    /* 卡片视图 */
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .card:hover {
      background: rgba(137, 180, 250, 0.08);
      border-color: rgba(137, 180, 250, 0.15);
      transform: translateY(-2px);
    }

    .card .card-icon {
      font-size: 32px;
      margin-bottom: 6px;
      display: block;
    }

    .card .card-name {
      font-size: 13px;
      color: #a6adc8;
      font-weight: 500;
    }

    .card .card-desc {
      font-size: 11px;
      color: #6c7086;
      margin-top: 2px;
    }

    .card .card-version {
      font-size: 10px;
      color: #45475a;
      margin-top: 4px;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #6c7086;
    }

    .empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state .empty-text {
      font-size: 14px;
    }

    /* ===== 插件视图 (WebView) ===== */
    #pluginViewContainer {
      display: none;
      margin-top: 12px;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.3);
      flex: 1;
      min-height: 0;
      position: relative;
    }

    #pluginViewContainer.active {
      display: flex;
    }

    #pluginViewContainer .plugin-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      font-size: 13px;
      color: #a6adc8;
    }

    #pluginViewContainer .plugin-header .close-plugin {
      background: none;
      border: none;
      color: #6c7086;
      font-size: 18px;
      cursor: pointer;
      padding: 0 8px;
      transition: color 0.2s;
    }

    #pluginViewContainer .plugin-header .close-plugin:hover {
      color: #f38ba8;
    }

    #pluginView {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
    }

    /* ===== 底部状态栏 ===== */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 12px;
      color: #45475a;
      flex-shrink: 0;
    }

    .status-bar .count {
      color: #6c7086;
    }

    .status-bar .version {
      color: #45475a;
    }

    /* ===== 动画 ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    body {
      animation: fadeIn 0.15s ease-out;
    }

    /* ===== 滚动条美化 ===== */
    ::-webkit-scrollbar {
      width: 3px;
    }
    ::-webkit-scrollbar-thumb {
      background: #45475a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>
<body>
  <!-- 拖拽区域 -->
  <div class="drag-area"></div>

  <div class="container">
    <!-- 搜索框 -->
    <div class="search-box">
      <span class="icon">🔍</span>
      <input 
        type="text" 
        id="searchInput" 
        placeholder="搜索插件或输入命令..." 
        autofocus
        spellcheck="false"
      />
      <span class="shortcut-hint">⌘K</span>
    </div>

    <!-- 标签栏 -->
    <div class="tabs">
      <button class="active" data-view="grid">📦 插件</button>
      <button data-view="list">📋 命令</button>
    </div>

    <!-- 内容区域 -->
    <div class="content-area" id="contentArea">
      <div class="grid-view" id="pluginGrid"></div>
    </div>

    <!-- 插件视图容器 -->
    <div id="pluginViewContainer">
      <div class="plugin-header">
        <span id="pluginTitle">🧩 插件</span>
        <button class="close-plugin" id="closePluginBtn">✕</button>
      </div>
      <webview 
        id="pluginView" 
        preload="./preload.js" 
        style="width: 100%; height: 100%; border: none; flex: 1;"
        partition="persist:shark-plugins"
      ></webview>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
      <span class="count" id="statusCount">🦈 加载中...</span>
      <span class="version">v1.0.0</span>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
