<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>示例插件 - 鲨鲨工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: rgba(30, 31, 44, 0.95);
      color: #cdd6f4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      padding: 30px;
    }
    .logo { font-size: 48px; }
    h1 { font-size: 22px; font-weight: 600; }
    .sub { color: #6c7086; font-size: 14px; }
    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 10px 24px;
      background: rgba(137, 180, 250, 0.12);
      border: 1px solid rgba(137, 180, 250, 0.15);
      border-radius: 8px;
      color: #89b4fa;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    button:hover {
      background: rgba(137, 180, 250, 0.22);
      transform: translateY(-1px);
    }
    #output {
      margin-top: 8px;
      padding: 14px 24px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      min-width: 200px;
      text-align: center;
      color: #a6adc8;
      font-size: 15px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="logo">🦈</div>
  <h1>鲨鲨工具 · 示例插件</h1>
  <p class="sub">这是一个运行在安全沙箱中的插件</p>
  
  <div class="btn-group">
    <button onclick="sayHello()">👋 打招呼</button>
    <button onclick="showTime()">🕐 显示时间</button>
    <button onclick="showPluginInfo()">📦 插件信息</button>
  </div>
  
  <div id="output">💡 点击按钮试试</div>

<!-- Live2D 显示容器 -->
<div id="live2d-container"></div>

  <script>
    // 确保 sharkPlugin API 可用
    if (window.sharkPlugin) {
      window.sharkPlugin.pluginReady('demo-plugin');
      console.log('🦈 示例插件已就绪，API 可用:', window.sharkPlugin);
    } else {
      console.log('⚠️ sharkPlugin API 不可用，请检查 webview 配置');
    }
    function sayHello() {
      document.getElementById('output').textContent = '👋 你好！我是鲨鲨工具的示例插件！';
    }

    function showTime() {
      const now = new Date();
      document.getElementById('output').textContent = `🕐 ${now.toLocaleDateString()} ${now.toLocaleTimeString()}`;
    }

    function showPluginInfo() {
      document.getElementById('output').innerHTML = `
        🦈 鲨鲨工具 示例插件<br>
        <span style="font-size:12px;color:#6c7086;">v1.0.0 · 使用 WebView 安全运行</span>
      `;
    }

    // 通知主进程插件已就绪
    if (window.sharkPlugin) {
      window.sharkPlugin.pluginReady('demo-plugin');
      console.log('🦈 示例插件已就绪，API 可用:', window.sharkPlugin);
    } else {
      console.log('⚠️ sharkPlugin API 不可用，请检查 webview 配置');
    }
  </script>
<script>
  // 确保 Live2D 显示容器存在
  if (!document.getElementById('live2d-container')) {
    const container = document.createElement('div');
    container.id = 'live2d-container';
    container.style.position = 'absolute';
    container.style.top = '0';
    container.style.left = '0';
    container.style.width = '100%';
    container.style.height = '100%';
    container.style.backgroundColor = 'transparent';
    container.style.display = 'flex';
    container.style.justifyContent = 'center';
    container.style.alignItems = 'center';
    container.style.zIndex = '99';
    container.style.pointerEvents = 'none';
    document.body.appendChild(container);
  }
</script>
</body>
</html>
